[build]
target = "x86_64-unknown-uefi"

[target.x86_64-unknown-uefi]
rustflags = ["-C", "no-redzone=yes"]

[alias]
build-milestone0 = "build --release --workspace"
test-boot-info = "test -p corboot-info --target x86_64-pc-windows-msvc"
test-kernel-foundation = "test -p corkernel --target x86_64-pc-windows-msvc"
